name: Deploy site and game to GitHub Pages

# Site (docs/site) at /, playable game (dist/web) at /play/.
on:
  push:
    branches: [main]
    paths: ["docs/site/**", "src/**", "index.html", "style.css", "tools/build-web.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build web bundle
        run: node tools/build-web.mjs
      - name: Assemble site
        run: |
          rm -rf _site
          cp -r docs/site _site
          mkdir -p _site/play
          cp -r dist/web/. _site/play/
          cp dist/pawfall.html _site/pawfall.html
          touch _site/.nojekyll
          test -f _site/play/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
