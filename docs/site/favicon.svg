  <!-- eyes -->
  <rect x="5" y="7" width="2" height="2" fill="#7bd44a"/>
  <rect x="9" y="7" width="2" height="2" fill="#7bd44a"/>
  <rect x="6" y="7" width="1" height="2" fill="#1f4a12"/>
  <rect x="10" y="7" width="1" height="2" fill="#1f4a12"/>
