<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0a0710"/>
  <!-- ears -->
  <rect x="3" y="2" width="2" height="2" fill="#b8561a"/>
  <rect x="11" y="2" width="2" height="2" fill="#b8561a"/>
  <!-- head -->
  <rect x="3" y="4" width="10" height="8" fill="#f08a24"/>
  <rect x="2" y="6" width="1" height="4" fill="#f08a24"/>
  <rect x="13" y="6" width="1" height="4" fill="#f08a24"/>
  <!-- stripes -->
  <rect x="7" y="4" width="2" height="1" fill="#a8430f"/>
  <rect x="5" y="5" width="1" height="2" fill="#a8430f"/>
  <rect x="10" y="5" width="1" height="2" fill="#a8430f"/>
  <!-- muzzle -->
